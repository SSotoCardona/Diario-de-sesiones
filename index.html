<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diario de Estudio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="contenedor">
      <h1>Diario de Estudio</h1>

      <section class="tarjeta racha" aria-live="polite">
        <p class="racha-etiqueta">Racha actual</p>
        <p class="racha-numero">🔥 <span id="racha">0</span></p>
        <p id="racha-texto" class="racha-texto">Empieza hoy para encender tu racha.</p>
      </section>

      <section class="tarjeta">
        <h2>Nueva sesión</h2>
        <form id="formulario">
          <label for="fecha">Fecha</label>
          <input id="fecha" name="fecha" type="date" required />

          <label for="tema">Tema</label>
          <input id="tema" name="tema" type="text" required placeholder="Por ejemplo: JavaScript" />

          <label for="minutos">Minutos</label>
          <input id="minutos" name="minutos" type="number" required min="1" step="1" placeholder="25" />

          <button type="submit">Guardar sesión</button>
        </form>
      </section>

      <section class="tarjeta">
        <h2>Sesiones</h2>
        <ul id="lista" class="lista"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
